name: Build APK

# Builds a debug APK in GitHub's cloud. Run it from the Actions tab ("Run workflow"),
# or it runs by itself every time you push changes.
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's runner already ships the Android SDK; just accept licenses and make sure
      # platform 36 (compileSdk) is there. (The setup-android action broke on the newest tools.)
      - name: Prepare Android SDK
        run: |
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: a free TMDB key (Settings > Secrets > TMDB_API_KEY) turns on TMDB details
      # (backdrops, logos, cast). Without it the app still builds; those extras are just empty.
      - name: Write local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: echo "tmdb.api_key=${TMDB_API_KEY}" > local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: lumera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
